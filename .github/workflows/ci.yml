name: Driver compile check

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Driver is untested; run manually only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2025

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Build x64 driver
        shell: powershell
        run: |
          .\scripts\build-driver.ps1

  bridge:
    runs-on: windows-2025

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Build pen forwarder
        shell: powershell
        run: |
          .\scripts\publish-bridge.ps1

      - name: Upload pen forwarder
        uses: actions/upload-artifact@v7
        with:
          name: EinkPenInjector
          path: dist\single\EinkPenInjector.exe