name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bridge:
    runs-on: windows-2025

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build pen forwarder
        shell: powershell
        run: |
          .\scripts\publish-bridge.ps1

      - name: Name release binary
        shell: powershell
        run: |
          Copy-Item dist\single\EinkPenInjector.exe "EinkPenInjector-$env:GITHUB_REF_NAME-win-x64.exe"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            EinkPenInjector-*.exe
            LICENSE
            THIRD-PARTY-NOTICES.md
          generate_release_notes: true
