name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bridge:
    runs-on: windows-2025

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build pen forwarder
        shell: powershell
        run: |
          .\scripts\publish-bridge.ps1

      - name: Name release binary
        shell: powershell
        run: |
          Copy-Item dist\single\EinkPenInjector.exe "EinkPenInjector-$env:GITHUB_REF_NAME-win-x64.exe"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            EinkPenInjector-*.exe
            LICENSE
            THIRD-PARTY-NOTICES.md
          generate_release_notes: true

  build-and-release:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Build x64 driver
        shell: powershell
        run: |
          .\scripts\build-driver.ps1

      - name: Create release zip
        shell: powershell
        run: |
          $repoRoot = "$env:GITHUB_WORKSPACE"
          $tag = "$env:GITHUB_REF_NAME"
          $payloadRoot = Join-Path $repoRoot 'x64\Release\EinkVirtualPen'
          if (-not (Test-Path $payloadRoot)) {
            throw "Driver package not found at $payloadRoot"
          }

          $certificate = Join-Path $repoRoot 'x64\Release\EinkVirtualPen.cer'
          if (Test-Path $certificate) {
            Copy-Item -Path $certificate -Destination $payloadRoot -Force
          }

          $zipName = "EinkVirtualPen-$tag.zip"
          $archivePath = Join-Path $repoRoot $zipName
          Compress-Archive -Path (Join-Path $payloadRoot '*') -DestinationPath $archivePath -Force
          Write-Host "Archive created: $archivePath"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
          generate_release_notes: true
